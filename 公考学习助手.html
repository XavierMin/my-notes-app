<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#7C5CFC">
<title>公考学习助手</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>📚</text></svg>">
<style>
:root {
  --c-purple: #7C5CFC;
  --c-pink: #FF6B9D;
  --c-blue: #5B8DEF;
  --c-orange: #FFB84D;
  --c-cyan: #4ECDC4;
  --c-green: #95E1A3;
  --c-bg: #F5F3FF;
  --c-card: #FFFFFF;
  --c-text: #2D2D2D;
  --c-text-light: #8E8E93;
  --c-border: #E5E5EA;
  --c-danger: #FF3B30;
  --c-success: #34C759;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --tab-h: 56px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  background: var(--c-bg);
  color: var(--c-text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; }
button { border:none; background:none; cursor:pointer; }
input, select, textarea { outline:none; }

/* ====== Splash Screen ====== */
#splash {
  position:fixed; inset:0; z-index:9999;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition: opacity 0.5s, transform 0.5s;
  padding: 40px 24px;
}
#splash.hide { opacity:0; transform:scale(1.05); pointer-events:none; }
#splash .flower-svg { width: 120px; height: 120px; margin-bottom: 16px; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
#splash .date-text { font-size:14px; color:var(--c-text-light); margin-bottom:4px; }
#splash .greeting { font-size:22px; font-weight:700; margin-bottom:6px; text-align:center; }
#splash .encourage { font-size:15px; color:var(--c-text-light); margin-bottom:32px; text-align:center; max-width:280px; }
#splash .enter-btn {
  padding:14px 48px; border-radius:30px; font-size:16px; font-weight:600;
  color:#FFF; background:linear-gradient(135deg, var(--c-purple), var(--c-pink));
  box-shadow: 0 4px 20px rgba(124,92,252,0.35); transition: transform 0.2s;
}
#splash .enter-btn:active { transform:scale(0.96); }

/* ====== Main App ====== */
#app { display:none; flex-direction:column; height:100vh; height:100dvh; }
#app.visible { display:flex; }
#content { flex:1; overflow-y:auto; overflow-x:hidden; padding:12px 16px 16px; -webkit-overflow-scrolling:touch; }
#content::-webkit-scrollbar { display:none; }

/* ====== Tab Bar ====== */
#tab-bar {
  display:flex; background:var(--c-card); border-top:1px solid var(--c-border);
  padding-bottom:var(--safe-bottom); height:calc(var(--tab-h) + var(--safe-bottom));
  flex-shrink:0; z-index:100;
}
.tab-item {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:10px; color:var(--c-text-light); gap:2px; transition:color 0.2s;
}
.tab-item.active { color:var(--c-purple); }
.tab-item .tab-icon { font-size:22px; }

/* ====== Card ====== */
.card {
  background:var(--c-card); border-radius:var(--radius); padding:16px;
  box-shadow:var(--shadow); margin-bottom:12px;
}
.card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.card-title { font-size:16px; font-weight:700; }
.card-subtitle { font-size:12px; color:var(--c-text-light); }

/* ====== Status Card ====== */
.status-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.status-item {
  text-align:center; padding:10px 6px; border-radius:var(--radius-sm);
  background:linear-gradient(135deg, rgba(124,92,252,0.08), rgba(91,141,239,0.08));
}
.status-item .val { font-size:20px; font-weight:700; color:var(--c-purple); }
.status-item .lbl { font-size:11px; color:var(--c-text-light); margin-top:2px; }

/* ====== Task Item ====== */
.task-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--c-border); }
.task-item:last-child { border-bottom:none; }
.task-checkbox {
  width:22px; height:22px; border-radius:50%; border:2px solid var(--c-border);
  flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-size:12px; color:#FFF; transition:all 0.2s;
}
.task-checkbox.done { background:var(--c-green); border-color:var(--c-green); }
.task-info { flex:1; min-width:0; }
.task-info .task-title { font-size:14px; font-weight:500; }
.task-info .task-meta { font-size:11px; color:var(--c-text-light); }
.task-progress { font-size:11px; color:var(--c-purple); font-weight:600; white-space:nowrap; }
.task-done .task-title { text-decoration:line-through; color:var(--c-text-light); }

/* ====== Entry Cards ====== */
.entry-card {
  display:flex; align-items:center; gap:12px; padding:14px;
  background:var(--c-card); border-radius:var(--radius);
  box-shadow:var(--shadow); margin-bottom:10px; cursor:pointer;
  transition:transform 0.15s;
}
.entry-card:active { transform:scale(0.98); }
.entry-icon {
  width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  font-size:20px; flex-shrink:0;
}
.entry-info { flex:1; min-width:0; }
.entry-title { font-size:15px; font-weight:600; }
.entry-desc { font-size:12px; color:var(--c-text-light); margin-top:1px; }
.entry-arrow { font-size:16px; color:var(--c-text-light); }

/* ====== Mistake / Weakpoint List ====== */
.mistake-item { display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--c-border); }
.mistake-item:last-child { border-bottom:none; }
.mistake-info { flex:1; min-width:0; }
.mistake-title { font-size:14px; font-weight:500; }
.mistake-tags { display:flex; gap:4px; flex-wrap:wrap; margin-top:2px; }
.mistake-tag {
  font-size:10px; padding:1px 6px; border-radius:4px;
  background:rgba(124,92,252,0.1); color:var(--c-purple);
}
.mistake-badge {
  font-size:10px; padding:2px 8px; border-radius:8px; font-weight:500;
}
.mistake-badge.review { background:rgba(255,107,157,0.12); color:var(--c-pink); }
.mistake-badge.mastered { background:rgba(149,225,163,0.2); color:var(--c-green); }

/* ====== Top Tabs ====== */
.top-tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:8px; -webkit-overflow-scrolling:touch; }
.top-tabs::-webkit-scrollbar { display:none; }
.top-tab {
  font-size:13px; padding:6px 14px; border-radius:20px; white-space:nowrap;
  background:var(--c-card); color:var(--c-text-light); border:1px solid var(--c-border);
  transition:all 0.2s; flex-shrink:0;
}
.top-tab.active { background:var(--c-purple); color:#FFF; border-color:var(--c-purple); }

/* ====== Buttons ====== */
.btn {
  display:inline-flex; align-items:center; gap:6px; padding:10px 20px; border-radius:12px;
  font-size:14px; font-weight:600; transition:all 0.2s;
}
.btn:active { transform:scale(0.96); }
.btn-primary { background:var(--c-purple); color:#FFF; }
.btn-pink { background:var(--c-pink); color:#FFF; }
.btn-outline { background:transparent; color:var(--c-purple); border:1.5px solid var(--c-purple); }
.btn-sm { padding:6px 12px; font-size:12px; border-radius:8px; }
.btn-block { width:100%; justify-content:center; }
.btn-danger { background:var(--c-danger); color:#FFF; }

/* ====== Form ====== */
.form-group { margin-bottom:12px; }
.form-label { font-size:12px; font-weight:600; color:var(--c-text-light); margin-bottom:4px; display:block; }
.form-input {
  width:100%; padding:10px 14px; border-radius:var(--radius-sm);
  border:1.5px solid var(--c-border); background:var(--c-card); font-size:14px;
  transition:border-color 0.2s;
}
.form-input:focus { border-color:var(--c-purple); }
.form-textarea { min-height:80px; resize:vertical; }

/* ====== Modal ====== */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:200;
  display:flex; align-items:flex-end; justify-content:center;
  animation:fadeIn 0.2s;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal {
  background:var(--c-card); border-radius:20px 20px 0 0; width:100%; max-height:85vh;
  overflow-y:auto; padding:20px 16px; padding-bottom:calc(20px + var(--safe-bottom));
}
.modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.modal-title { font-size:17px; font-weight:700; }

/* ====== Hour Selector ====== */
.hour-selector { display:flex; align-items:center; gap:8px; justify-content:center; padding:12px 0; }
.hour-roller {
  width:60px; height:120px; overflow-y:auto; border-radius:12px;
  border:1.5px solid var(--c-border); text-align:center;
  scroll-snap-type: y mandatory; -webkit-overflow-scrolling:touch;
}
.hour-roller::-webkit-scrollbar { display:none; }
.hour-roller .hr-item {
  height:40px; display:flex; align-items:center; justify-content:center;
  font-size:18px; font-weight:600; scroll-snap-align:center;
  color:var(--c-text-light); transition:color 0.2s;
}
.hour-roller .hr-item.selected { color:var(--c-purple); font-size:24px; }
.hour-unit { font-size:13px; color:var(--c-text-light); }

/* ====== Pomodoro ====== */
.pomodoro {
  text-align:center; padding:20px;
  background:linear-gradient(135deg, rgba(255,107,157,0.08), rgba(124,92,252,0.08));
  border-radius:var(--radius);
}
.pomodoro .timer { font-size:48px; font-weight:800; font-variant-numeric:tabular-nums; margin:12px 0; }
.pomodoro .timer.running { color:var(--c-pink); }

/* ====== Section Score Bars ====== */
.section-bars { display:flex; flex-direction:column; gap:6px; }
.section-bar-item { display:flex; align-items:center; gap:8px; }
.section-bar-label { font-size:12px; width:60px; text-align:right; flex-shrink:0; }
.section-bar-track { flex:1; height:8px; border-radius:4px; background:var(--c-border); overflow:hidden; }
.section-bar-fill { height:100%; border-radius:4px; transition:width 0.3s; }
.section-bar-val { font-size:11px; color:var(--c-text-light); width:40px; flex-shrink:0; }

/* ====== Material Card ====== */
.material-item { padding:10px 0; border-bottom:1px solid var(--c-border); }
.material-item:last-child { border-bottom:none; }
.material-source { font-size:11px; color:var(--c-text-light); margin-top:2px; }
.material-content { font-size:13px; color:var(--c-text); margin-top:4px; line-height:1.6; }

/* ====== Heatmap Placeholder ====== */
.chart-container { margin:8px 0; min-height:160px; }

/* ====== Profile ====== */
.profile-header { text-align:center; padding:20px 0; }
.profile-avatar {
  width:72px; height:72px; border-radius:50%; background:linear-gradient(135deg, var(--c-purple), var(--c-pink));
  display:flex; align-items:center; justify-content:center; font-size:32px;
  margin:0 auto 10px; color:#FFF;
}
.profile-name { font-size:20px; font-weight:700; }
.profile-stage { font-size:13px; color:var(--c-text-light); margin-top:2px; }
.profile-stats { display:flex; justify-content:center; gap:24px; margin-top:12px; }
.profile-stat { text-align:center; }
.profile-stat .ps-val { font-size:18px; font-weight:700; color:var(--c-purple); }
.profile-stat .ps-lbl { font-size:11px; color:var(--c-text-light); }

/* ====== Sports ====== */
.sport-tags { display:flex; flex-wrap:wrap; gap:6px; }
.sport-tag {
  display:inline-flex; align-items:center; gap:4px; padding:6px 12px;
  border-radius:16px; background:rgba(124,92,252,0.08); font-size:13px;
}
.sport-tag .sport-del { color:var(--c-text-light); font-size:14px; cursor:pointer; }

/* ====== Toast ====== */
#toast {
  position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:300;
  background:var(--c-text); color:#FFF; padding:10px 24px; border-radius:20px;
  font-size:13px; font-weight:500; opacity:0; transition:opacity 0.3s; pointer-events:none;
}
#toast.show { opacity:1; }

/* ====== Drag handle ====== */
.drag-handle { cursor:grab; color:var(--c-text-light); font-size:18px; padding:4px; }
.drag-handle:active { cursor:grabbing; }

/* ====== Sync Status ====== */
.sync-status { font-size:11px; color:var(--c-text-light); display:flex; align-items:center; gap:4px; }
.sync-dot { width:6px; height:6px; border-radius:50%; }
.sync-dot.synced { background:var(--c-green); }
.sync-dot.syncing { background:var(--c-orange); animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ====== AI optimize ====== */
.ai-btn {
  background:linear-gradient(135deg, #6366F1, #8B5CF6); color:#FFF;
  font-size:13px; padding:10px 18px; border-radius:20px; font-weight:600;
  box-shadow:0 3px 12px rgba(99,102,241,0.3);
}

/* ====== Utils ====== */
.text-center { text-align:center; }
.mt-8 { margin-top:8px; }
.mt-12 { margin-top:12px; }
.mt-16 { margin-top:16px; }
.mb-8 { margin-bottom:8px; }
.mb-12 { margin-bottom:12px; }
.flex-row { display:flex; align-items:center; gap:8px; }
.flex-between { display:flex; align-items:center; justify-content:space-between; }
.flex-wrap { flex-wrap:wrap; }
.color-purple { color:var(--c-purple); }
.color-pink { color:var(--c-pink); }
.color-blue { color:var(--c-blue); }
.color-orange { color:var(--c-orange); }
.color-cyan { color:var(--c-cyan); }
.color-green { color:var(--c-green); }
.bg-purple { background:rgba(124,92,252,0.1); }
.bg-pink { background:rgba(255,107,157,0.1); }
.bg-blue { background:rgba(91,141,239,0.1); }
.bg-orange { background:rgba(255,184,77,0.1); }
.bg-cyan { background:rgba(78,205,196,0.1); }
.bg-green { background:rgba(149,225,163,0.1); }

/* ====== Exam card ====== */
.exam-card { padding:12px; margin-bottom:8px; }
.exam-score { font-size:28px; font-weight:800; color:var(--c-purple); }
.exam-score .total { font-size:14px; font-weight:400; color:var(--c-text-light); }

/* ====== Empty state ====== */
.empty-state { text-align:center; padding:32px 16px; color:var(--c-text-light); }
.empty-state .empty-icon { font-size:40px; margin-bottom:8px; }
.empty-state .empty-text { font-size:14px; }

/* ====== Week/Month/Year chart selector ====== */
.chart-period-selector { display:flex; gap:4px; }
.chart-period-btn {
  font-size:11px; padding:3px 10px; border-radius:10px; border:1px solid var(--c-border);
  color:var(--c-text-light); transition:all 0.15s;
}
.chart-period-btn.active { background:var(--c-purple); color:#FFF; border-color:var(--c-purple); }

/* ====== Step progress ====== */
.step-progress { display:flex; gap:3px; align-items:flex-end; }
.step-dot {
  width:8px; border-radius:4px; background:var(--c-border); transition:all 0.2s;
}
</style>
</head>
<body>

<!-- ====== Splash Screen ====== -->
<div id="splash">
  <svg class="flower-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(60,60)">
      <!-- Petals -->
      <ellipse cx="0" cy="-25" rx="12" ry="22" fill="#FF6B9D" opacity="0.8" transform="rotate(0)"/>
      <ellipse cx="0" cy="-25" rx="12" ry="22" fill="#FF6B9D" opacity="0.8" transform="rotate(72)"/>
      <ellipse cx="0" cy="-25" rx="12" ry="22" fill="#FF6B9D" opacity="0.8" transform="rotate(144)"/>
      <ellipse cx="0" cy="-25" rx="12" ry="22" fill="#FF6B9D" opacity="0.8" transform="rotate(216)"/>
      <ellipse cx="0" cy="-25" rx="12" ry="22" fill="#FF6B9D" opacity="0.8" transform="rotate(288)"/>
      <!-- Inner petals -->
      <ellipse cx="0" cy="-16" rx="8" ry="14" fill="#FFB84D" opacity="0.85" transform="rotate(36)"/>
      <ellipse cx="0" cy="-16" rx="8" ry="14" fill="#FFB84D" opacity="0.85" transform="rotate(108)"/>
      <ellipse cx="0" cy="-16" rx="8" ry="14" fill="#FFB84D" opacity="0.85" transform="rotate(180)"/>
      <ellipse cx="0" cy="-16" rx="8" ry="14" fill="#FFB84D" opacity="0.85" transform="rotate(252)"/>
      <ellipse cx="0" cy="-16" rx="8" ry="14" fill="#FFB84D" opacity="0.85" transform="rotate(324)"/>
      <!-- Center -->
      <circle cx="0" cy="0" r="7" fill="#FFD700"/>
      <!-- Stem -->
      <path d="M0,7 Q5,30 -3,55" stroke="#95E1A3" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Leaves -->
      <ellipse cx="12" cy="35" rx="14" ry="5" fill="#95E1A3" opacity="0.7" transform="rotate(30,12,35)"/>
      <ellipse cx="-12" cy="42" rx="12" ry="4" fill="#95E1A3" opacity="0.7" transform="rotate(-25,-12,42)"/>
    </g>
  </svg>
  <div class="date-text" id="splash-date"></div>
  <div class="greeting" id="splash-greeting"></div>
  <div class="encourage" id="splash-encourage"></div>
  <button class="enter-btn" onclick="enterApp()">进入工作台 →</button>
</div>

<!-- ====== Main App ====== -->
<div id="app">
  <div id="content"></div>
  <div id="tab-bar">
    <div class="tab-item active" data-tab="home" onclick="switchTab('home')">
      <span class="tab-icon">🏠</span><span>首页</span>
    </div>
    <div class="tab-item" data-tab="growth" onclick="switchTab('growth')">
      <span class="tab-icon">🌱</span><span>公考成长</span>
    </div>
    <div class="tab-item" data-tab="mistakes" onclick="switchTab('mistakes')">
      <span class="tab-icon">📝</span><span>错题复盘</span>
    </div>
    <div class="tab-item" data-tab="insights" onclick="switchTab('insights')">
      <span class="tab-icon">📊</span><span>数据洞察</span>
    </div>
    <div class="tab-item" data-tab="profile" onclick="switchTab('profile')">
      <span class="tab-icon">👤</span><span>我的</span>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Inline SVG Charts -->

    for (var ti = 0; ti < allTypes.length; ti++) {
      var entityType = allTypes[ti], cloudItems = cloudByType[entityType] || [];
      var localItems = getLocalAll(entityType), localMap = new Map(localItems.map(function(i) { return [i.id, i]; }));
      var merged = [];
      for (var ci = 0; ci < cloudItems.length; ci++) {
        var entity = fromSupabaseRow(cloudItems[ci]), localItem = localMap.get(entity.id);
        if (!localItem) { merged.push(entity); pulled++; }
        else { merged.push(entity.updatedAt >= localItem.updatedAt ? entity : localItem); localMap.delete(entity.id); }
      }
      localMap.forEach(function(localOnly) { merged.push(localOnly); pushOne(localOnly).catch(function(){}); pushed++; });
      localStorage.setItem(getStorageKey(entityType), JSON.stringify(merged));
    }
    var profileCloud = cloudByType["profile"] || [];
    if (profileCloud.length > 0) {
      var p = fromSupabaseRow(profileCloud[0]);
      var localP = getProfile();
      localStorage.setItem("gk_profile", JSON.stringify(localP.updatedAt >= p.updatedAt ? localP : p));
      pulled++;
    }
    localStorage.setItem("gk_last_sync", String(Date.now()));
  } catch(e) { console.warn("[Sync] syncAll failed:", e.message); }
  return { pulled: pulled, pushed: pushed, deleted: 0 };
}

function h(tag, attrs, children) {

  if (children) {
    if (typeof children === "string") el.textContent = children;
    else if (Array.isArray(children)) children.forEach(function(c) { if (c) el.appendChild(c); });
    else el.appendChild(children);
  }
  return el;
}

function getCheckinChartData() {
  var today = new Date(), labels = [], days = 0;
  if (chartPeriod === "week") days = 7;
  else if (chartPeriod === "month") days = 30;
  else days = 365;
  var checkins = getCheckins();
  var map = {};
  checkins.forEach(function(c) { var d = c.date || c.title; if (d) map[d] = c.studyHours || 0; });
  var data = [];
  for (var i = days - 1; i >= 0; i--) {
    var d = new Date(today); d.setDate(d.getDate() - i);
    var ds = d.toISOString().slice(0, 10);
    var label;
    if (chartPeriod === "week") label = (d.getMonth()+1) + "/" + d.getDate();
    else if (chartPeriod === "month") { if (i % 3 === 0) label = (d.getMonth()+1) + "/" + d.getDate(); else label = ""; }
    else { if (d.getDate() === 1 || i === 0) label = (d.getMonth()+1) + "/" + d.getDate(); else label = ""; }
    data.push({ label: label, value: map[ds] || 0 });
  }
  return data;
}

var pomodoroInterval = null;
var pomodoroTaskId = null;
var pomodoroSeconds = 0;
function startPomodoro(taskId) {
  pomodoroTaskId = taskId;
  pomodoroSeconds = 25 * 60;

  var overlay = h("div", { className: "modal-overlay", id: "pomodoro-modal" });
  var modal = h("div", { className: "modal" });
  modal.appendChild(h("div", { className: "modal-header" }, [h("span", { className: "modal-title" }, "\ud83c\udf45 \u756a\u8304\u949f"), h("button", { style: "font-size:20px", onclick: function() { stopPomodoro(); } }, "\u2715")]));
  var timerDiv = h("div", { className: "pomodoro" });
  var timerEl = h("div", { className: "timer running" }, "25:00");
  timerDiv.appendChild(timerEl);
  timerDiv.appendChild(h("div", { style: "font-size:13px;color:var(--c-text-light);margin-top:8px" }, "\u4e13\u6ce8\u65f6\u95f4 25 \u5206\u949f"));
  modal.appendChild(timerDiv);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  clearInterval(pomodoroInterval);
  pomodoroInterval = setInterval(function() {
    pomodoroSeconds--;
    var m = Math.floor(pomodoroSeconds / 60), s = pomodoroSeconds % 60;
    timerEl.textContent = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    if (pomodoroSeconds <= 0) {
      clearInterval(pomodoroInterval);
      timerEl.textContent = "00:00";
      addPomodoro(pomodoroTaskId, 25).then(function() { renderContent(); });
      showToast("\ud83c\udf89 \u756a\u8304\u949f\u5b8c\u6210\uff01+25\u5206\u949f");
      setTimeout(stopPomodoro, 1500);
    }
  }, 1000);
}

function stopPomodoro() {
  clearInterval(pomodoroInterval);
  var el = document.getElementById("pomodoro-modal");
  if (el) el.remove();
}

async function aiOptimizeTasks() {
  var tasks = getTasks().filter(function(t){return !t.done;});
  if (tasks.length < 2) { showToast("\u4efb\u52a1\u592a\u5c11\uff0c\u65e0\u9700\u4f18\u5316"); return; }
  // Simple AI: prioritize by priority desc, then by progress ratio asc
  tasks.sort(function(a, b) {
    var pa = a.priority || 0, pb = b.priority || 0;
    if (pa !== pb) return pb - pa;
    var ra = (a.goalCount||1) > 0 ? (a.doneCount||0)/(a.goalCount||1) : 0;
    var rb = (b.goalCount||1) > 0 ? (b.doneCount||0)/(b.goalCount||1) : 0;
    return ra - rb;
  });
  for (var i = 0; i < tasks.length; i++) { await updateTask(tasks[i].id, { sort: i }); }
  showToast("\u2705 \u5df2\u6309\u4f18\u5148\u7ea7\u548c\u8fdb\u5ea6\u91cd\u65b0\u6392\u5e8f");
  renderContent();
}

function buildMistakeHeatmapData() {
  var mistakes = getMistakes();
  var map = {};
  mistakes.forEach(function(m) {
    var date = new Date(m.createdAt).toISOString().slice(0,10);

  return Object.keys(map).map(function(k) { return { date: k, value: map[k] }; });
}

  // Sync

  syncCard.appendChild(h("div", { className: "card-header" }, h("span",{className:"card-title"},"\u4e91\u7aef\u540c\u6b65")));
  var lastSync = localStorage.getItem("gk_last_sync");
  syncCard.appendChild(h("div",{className:"sync-status mb-8"}, [h("span",{className:"sync-dot synced"}), " \u4e0a\u6b21\u540c\u6b65: " + (lastSync ? new Date(parseInt(lastSync)).toLocaleString() : "\u4ece\u672a")]));
  var btnRow = h("div",{className:"flex-row",style:"gap:8px"});
  btnRow.appendChild(h("button",{className:"btn btn-primary",onclick:async function(){
    showToast("\ud83d\udd04 \u540c\u6b65\u4e2d...");
    var result = await syncAll();
    showToast("\u2705 \u540c\u6b65\u5b8c\u6210\uff01\u62c9\u53d6 " + result.pulled + " \u6761\uff0c\u63a8\u9001 " + result.pushed + " \u6761");
    renderContent();
  }}, "\ud83d\udd04 \u540c\u6b65\u4e91\u7aef"));
  btnRow.appendChild(h("button",{className:"btn btn-outline",onclick:exportData},"\ud83d\udce4 \u5bfc\u51fa"));
  btnRow.appendChild(h("button",{className:"btn btn-outline",onclick:importData},"\ud83d\udce5 \u5bfc\u5165"));
  syncCard.appendChild(btnRow);
  container.appendChild(syncCard);
}

function showAddSportModal() {
  showModal("\u6dfb\u52a0\u8fd0\u52a8\u9879\u76ee", [
    formGroup("\u8fd0\u52a8\u540d\u79f0", h("input",{className:"form-input",id:"ms-name",placeholder:"\u4f8b\u5982\uff1a\u4fef\u5367\u6491"})),
    h("button",{className:"btn btn-primary btn-block mt-16",onclick:async function(){
      await addSport(document.getElementById("ms-name").value);
      closeModal(); renderContent();
    }}, "\u6dfb\u52a0")
  ]);
}

function exportData() {
  var data = {
    profile: getProfile(),
    tasks: getTasks(),
    mistakes: getMistakes(),
    exams: getExams(),
    weakpoints: getWeakpoints(),
    materials: getMaterials(),
    checkins: getCheckins(),
    study_logs: getStudyLogs(),
    exportedAt: new Date().toISOString()
  };
  var blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "gk_backup_" + todayStr() + ".json";
  a.click(); URL.revokeObjectURL(url);
  showToast("\u2705 \u5df2\u5bfc\u51fa\u5907\u4efd");
}

function importData() {
  var input = document.createElement("input");
  input.type = "file"; input.accept = ".json";
  input.onchange = async function(e) {
    var file = e.target.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = async function(ev) {
      try {
        var data = JSON.parse(ev.target.result);
        if (data.profile) localStorage.setItem("gk_profile", JSON.stringify(data.profile));
        if (data.tasks) localStorage.setItem("gk_tasks", JSON.stringify(data.tasks));
        if (data.mistakes) localStorage.setItem("gk_mistakes", JSON.stringify(data.mistakes));
        if (data.exams) localStorage.setItem("gk_exams", JSON.stringify(data.exams));
        if (data.weakpoints) localStorage.setItem("gk_weakpoints", JSON.stringify(data.weakpoints));
        if (data.materials) localStorage.setItem("gk_materials", JSON.stringify(data.materials));
        if (data.checkins) localStorage.setItem("gk_checkins", JSON.stringify(data.checkins));
        if (data.study_logs) localStorage.setItem("gk_study_logs", JSON.stringify(data.study_logs));
        showToast("\u2705 \u5bfc\u5165\u6210\u529f"); renderContent();
      } catch(e) { showToast("\u274c \u5bfc\u5165\u5931\u8d25\uff1a\u6587\u4ef6\u683c\u5f0f\u9519\u8bef"); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ====== Modal ======
function showModal(title, children) {
  closeModal();
  var overlay = h("div", { className: "modal-overlay", id: "global-modal", onclick: function(e) { if (e.target === overlay) closeModal(); } });
  var modal = h("div", { className: "modal" });
  modal.appendChild(h("div", { className: "modal-header" }, [h("span", { className: "modal-title" }, title), h("button", { style: "font-size:20px;line-height:1", onclick: closeModal }, "\u2715")]));
  if (Array.isArray(children)) children.forEach(function(c) { modal.appendChild(c); });
  else modal.appendChild(children);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

function closeModal() {
  var el = document.getElementById("global-modal");
  if (el) el.remove();
}

function formGroup(label, input) {
  var g = h("div", { className: "form-group" });
  g.appendChild(h("label", { className: "form-label" }, label));
  g.appendChild(input);
  return g;
}

// ====== Service Worker ======
if ("serviceWorker" in navigator) {
  var swCode = 'self.addEventListener("install",function(e){self.skipWaiting()});self.addEventListener("activate",function(e){e.waitUntil(clients.claim())});self.addEventListener("fetch",function(e){e.respondWith(caches.match(e.request).then(function(r){return r||fetch(e.request)}))});';
  var swBlob = new Blob([swCode], {type: "application/javascript"});
  var swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(function() {});
}

// ====== Init ======
initData();
initSplash();

// Show splash on first load
if (!localStorage.getItem("gk_splash_seen")) {
  localStorage.setItem("gk_splash_seen", "1");
}
// Always show splash for demo
showSplash = true;

// Handle app re-entry (skip splash if already entered)
window.addEventListener("pageshow", function(e) {
  if (!showSplash) {
    document.getElementById("splash").style.display = "none";
    document.getElementById("app").classList.add("visible");
  }
});
</script>
